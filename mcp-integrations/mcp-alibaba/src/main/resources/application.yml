# ============================================================
# Spring AI Alibaba MCP 集成 — 示例配置
# ============================================================
# 位置: mcp-integrations/mcp-alibaba/src/main/resources/application.yml
#
# 前提:
#   1. 阿里云百炼平台开通 DashScope 并获取 API Key
#      https://bailian.console.aliyun.com/ → 模型广场 → API Key 管理
#   2. MCP Enterprise Server 已在 localhost:8081 运行
#
# 使用方式（三种）:
#   a) 仅配置参考: 复制本文件到你的 Spring Boot 项目 resources 目录
#   b) 集成模块测试: 打开 mcp-server 后运行
#      mvn spring-boot:run -pl mcp-integrations/mcp-alibaba
#   c) 全量构建 (含 alibaba + client 示例):
#      mvn clean install -Pfull
# ============================================================

server:
  port: 8081

spring:
  application:
    name: mcp-enterprise-alibaba-demo

  ai:
    # ---- 阿里云 DashScope (通义千问) ----
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-your-dashscope-api-key}
    chat:
      options:
        model: qwen-max          # 通义千问最大模型
    embedding:
      options:
        model: text-embedding-v3 # 文本向量模型

# ===== MCP Enterprise 集成配置 =====
mcp:
  enterprise:
    integration:
      alibaba:
        enabled: true                # 是否启用 Alibaba 集成 (默认 true)
        chat-model: qwen-max         # 通义千问聊天模型
        embedding-model: text-embedding-v3
        server-port: 8081            # MCP Server 端口
        auto-detect-cloud: true      # 自动检测阿里云环境 (ECS/ACK 环境变量)
        mcp-client-auto-connect: true  # 启动时自动连接 MCP Server
        connect-timeout: 10          # 连接超时(秒)
        read-timeout: 60             # 读取超时(秒)

# ===== MCP Server 安全配置 (由 mcp-core 提供) =====
# 生产环境务必通过环境变量覆盖，不要硬编码
mcp-server:
  api-key: ${MCP_API_KEY:changeme-in-production}
  security:
    rate-limit:
      enabled: true
      capacity: 100
      refill-per-minute: 60

# ===== 日志 =====
logging:
  level:
    com.mcp.integration.alibaba: DEBUG
    org.springframework.ai: INFO
