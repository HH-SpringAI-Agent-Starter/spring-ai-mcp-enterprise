server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: mcp-enterprise-server

mcp:
  enterprise:
    server:
      port: 8081
    security:
      api-key-enabled: true
      rate-limit-enabled: true
      audit-log-enabled: true
      # V1.19: 工具级 Scope 权限映射（Token Scope → Tool ACL，RFC 6750 insufficient_scope）
      # enabled=false 时行为与 V1.18 完全一致（向后兼容）；开启后仅拦截"携带 Bearer 令牌且越权"的调用方
      scope:
        enabled: ${MCP_SCOPE_ENABLED:false}
        # 分类兑底：未显式声明 scope 的工具按分类映射（支持 * / ** 通配）
        category-defaults:
          finance: "tools:finance:*"
          database: "tools:database:*"
          search: "tools:search:*"
        # 工具名覆盖：改配置即可调整单个工具权限，无需改代码
        tool-overrides:
          finance_indicator: "tools:finance:read"
    monitor:
      enabled: true
    registry:
      auto-scan-enabled: true
      scan-packages: com.mcp.tool
      # V1.21: Skill Registry（技能注册表 + 语义化版本治理 + 灰度路由 + 故障回滚，默认启用）
      # 端点: /api/admin/skills (管理) + /api/mcp/skills (客户端发现)
      skill:
        enabled: ${MCP_SKILL_REGISTRY_ENABLED:true}
        # 每个 Skill 保留的历史版本数（超出自动裁剪最旧版本）
        max-versions-per-skill: 20
        # V1.22: 持久化后端。memory（默认，纯内存，重启丢失，同 V1.21）| jdbc（重启/滚动发布后自动恢复）
        store: ${MCP_SKILL_REGISTRY_STORE:memory}
        # V1.22: store=jdbc 时的表名
        table: ${MCP_SKILL_REGISTRY_TABLE:mcp_skill_registry}
        # V1.22: 启动时自动 CREATE TABLE IF NOT EXISTS（用 Flyway/Liquibase 托管 schema 时置 false）
        init-schema: ${MCP_SKILL_REGISTRY_INIT_SCHEMA:true}
    # V1.15: A2A (Agent2Agent) 双协议网关（默认关闭，开启后暴露 /a2a/agent-card 与 /a2a/rpc）    # V1.16: 新增 SSE 流式 (message/stream + task/resubscribe) + securitySchemes 声明（mcp-auth 打通第一步）
    a2a:
      enabled: ${MCP_A2A_ENABLED:false}
      base-path: /a2a
      agent-name: MCP Enterprise A2A Gateway
      api-key: ${MCP_A2A_API_KEY:}
      # V1.16: SSE 流式开关（默认开启，被 enabled 约束）
      streaming-enabled: ${MCP_A2A_STREAMING_ENABLED:true}
      # V1.16: Agent Card securitySchemes 声明（none | api-key | oauth2；留空自动按 api-key 推导）
      security-scheme: ${MCP_A2A_SECURITY_SCHEME:}
      # V1.16: security-scheme=oauth2 时的 token 端点（默认对接 mcp-auth /oauth2/token）
      oauth2-token-url: ${MCP_A2A_OAUTH2_TOKEN_URL:}
      # V1.18: Signed Agent Card 签名密钥（A2A v1.2 供应链安全基线）——非空时 agent-card 返回
      # {agentCard, signature} 信封 + X-Agent-Card-Signature 头；与 mcp.auth.jwt-secret 同值可实现
      # "同一把密钥：mcp-auth 发证 + 网关验签 + Agent Card 签名"完整闭环
      card-signing-key: ${MCP_A2A_CARD_SIGNING_KEY:}
      card-key-id: ${MCP_A2A_CARD_KEY_ID:mcp-a2a-1}
    # V1.26: Governance 治理模块（人类在环审批 HITL + 风险分级 + 敏感数据脱敏，OWASP MCP Governance 对齐）
    # 出厂默认 enforce=false（灰度）：仅登记风险/审批/审计，不拦截调用；验证后置 true 开启强制
    # 管理端点: /api/admin/governance/approvals·stats·audit·policy
    governance:
      enabled: ${MCP_GOVERNANCE_ENABLED:true}
      enforce: ${MCP_GOVERNANCE_ENFORCE:false}
      message-paths:
        - /api/mcp/message
        - /api/mcp/v2/message
        - /mcp
      approval-header: ${MCP_GOVERNANCE_APPROVAL_HEADER:X-MCP-Approval-Id}
      default-tier: T2
      require-approval-tiers: [T3, T4]
      deny-tiers: []
      # 显式工具等级覆盖（生产建议必配：比关键词启发式更可靠）
      tool-tiers:
        #   finance_transfer: T4
        #   db_execute: T4
      approval:
        enabled: true
        ttl-seconds: 900
        max-pending: 5000
      redaction:
        enabled: true
        mask: "***"
      audit:
        max-events: 2000
        log-to-slf4j: true
  tool:
    http:
      enabled: true
      # 白名单：仅允许调用这些主机（* 通配符支持子域名），默认仅 localhost
      allowed-hosts:
        - localhost
        - 127.0.0.1
      connect-timeout: 5s
      read-timeout: 30s
      max-response-bytes: 1048576

logging:
  level:
    com.mcp: INFO
    org.springframework.ai: WARN
