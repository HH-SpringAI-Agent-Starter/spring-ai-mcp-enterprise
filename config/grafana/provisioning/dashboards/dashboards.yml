apiVersion: 1

providers:
  - name: 'MCP Enterprise Dashboards'
    orgId: 1
    folder: 'MCP Enterprise'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false