server:
  port: 8082

spring:
  application:
    name: mcp-client-spring-ai-demo

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-your-dashscope-api-key}
    chat:
      options:
        model: qwen-max

mcp:
  enterprise:
    server:
      url: ${MCP_SERVER_URL:http://localhost:8081}
      api-key: ${MCP_API_KEY:default-admin-key}

logging:
  level:
    com.mcp.enterprise.examples.springai: DEBUG
